name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Lint, build, typecheck, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build first: it fetches the fonts and generates next-env.d.ts.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e against the production server
        run: pnpm test:e2e
        env:
          CI: "1"
          BANNED_PATTERNS: ${{ secrets.BANNED_PATTERNS }}
          # Pushes to main must run the private patterns; fork PRs have no secrets.
          REQUIRE_BANNED_PATTERNS: ${{ github.event_name == 'push' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

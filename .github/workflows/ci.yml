name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly secret scan, in case rules improve
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Event in the key: a push must not cancel the weekly secret scan.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Lint, build, typecheck, tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build first: it generates next-env.d.ts, which typecheck needs.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      # No artifacts are uploaded from this step: it runs with the private
      # banned patterns, and failures report private matches by index only.
      - name: Tests (e2e against the production server, plus unit)
        run: pnpm test:e2e
        env:
          CI: "1"
          BANNED_PATTERNS: ${{ secrets.BANNED_PATTERNS }}
          # Pushes to main must run the private patterns; fork PRs have no secrets.
          REQUIRE_BANNED_PATTERNS: ${{ github.event_name == 'push' && '1' || '0' }}

  secrets:
    name: Secret scan (every commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --verbose .
